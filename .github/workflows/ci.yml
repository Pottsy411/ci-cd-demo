name: CI-CD Demo

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run application (Build Step)
        run: python app.py

      - name: Deploy Step (Echo Only)
        run: echo "Deploying application..."

